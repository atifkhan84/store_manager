spring.mvc.view.prefix =/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
server.port = 8075


# Database
spring.datasource.url= jdbc:mysql://localhost:3306/ntspbms718db
spring.datasource.username=root
spring.datasource.password=root

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate ddl auto (create, create-drop, update,validate): with "update" the database
# schema will be automatically updated accordingly to java entities found in
# the project
spring.jpa.hibernate.ddl-auto = update

# Naming strategy
spring.jpa.hibernate.naming-strategy = org.hibernate.cfg.ImprovedNamingStrategy
#org.hibernate.cfg.SpringPhysicalNamingStrategy
#org.hibernate.cfg.EJB3NamingStrategy
#org.hibernate.cfg.ImprovedNamingStrategy

# Allows Hibernate to generate SQL optimized for a particular DBMS
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect

#-----------------------By Shadab----------------------------
# Enable SQL logging
spring.jpa.show-sql=true

# Format SQL for readability
spring.jpa.properties.hibernate.format_sql=true

# Use a clean SQL comment style (optional)
spring.jpa.properties.hibernate.use_sql_comments=true

# (Optional) Set logging level to see SQL queries
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

